name: fatna-android-build
on:
  workflow_dispatch:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - name: Build APK
        shell: bash
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew && ./gradlew assembleDebug --stacktrace; elif [ -f ./app/build.gradle.kts ] || [ -f ./app/build.gradle ]; then gradle assembleDebug --stacktrace; else exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: fatna-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
